name: Verify S00 S01
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/install.py
      - run: python scripts/planning.py --check
      - run: uv run --frozen pytest -q
        working-directory: backend
      - run: uv run --frozen ruff check app tests ../scripts
        working-directory: backend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --output-file /tmp/requirements-audit.txt
        working-directory: backend
      - run: uvx pip-audit==2.10.1 -r /tmp/requirements-audit.txt --disable-pip --no-deps
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
